stage: sft
# Adjust model path/name and template if your LLaMA-Factory version uses different identifiers.

### model
model_name_or_path: "YOUR_MODEL_PATH"

### method
do_train: true
finetuning_type: lora

### dataset
# Generated by finetune/prepare_sft_dataset.py
# Format: alpaca-style jsonl with fields: instruction/input/output

dataset: local_material_sft
dataset_dir: "data"
cutoff_len: 4096

# Many Qwen variants work with template: qwen
# If your LLaMA-Factory supports qwen3 explicitly, change template accordingly.
# NOTE: dataset formatting is controlled by finetune/data/dataset_info.json (alpaca-style fields).
# `template` here refers to the model chat/prompt template. For Qwen models, use `qwen`.
template: qwen

### output
output_dir: "outputs/qwen3-30b-a3b-lora-material"
logging_steps: 10
save_steps: 300
plot_loss: true
overwrite_output_dir: true
per_device_train_batch_size: 1
gradient_accumulation_steps: 16
learning_rate: 1.0e-4
num_train_epochs: 2.0
lr_scheduler_type: cosine
warmup_ratio: 0.03
max_grad_norm: 1.0

bf16: true

### QLoRA
quantization_bit: 4
quantization_type: nf4

### LoRA
lora_rank: 32
lora_alpha: 64
lora_dropout: 0.05
# Common target modules; adjust if your model uses different names
lora_target: q_proj,k_proj,v_proj,o_proj,gate_proj,up_proj,down_proj

### deepspeed
# Provide ds config path when launching.
deepspeed: "configs/ds_zero2.json"
ddp_timeout: 180000

### eval
val_size: 0.0
per_device_eval_batch_size: 1

### misc
seed: 7